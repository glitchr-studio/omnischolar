# glitchr/omnischolar with every source package, against the real services:
#
#   cp .env.dist .env                                          # a contact address; an OpenAlex key if you have one
#   docker compose run --rm omnischolar sources                # which sources are installed and configured
#   docker compose run --rm omnischolar author openalex A5108007452
#   docker compose run --rm omnischolar works openalex A5108007452 --from 2024 --to 2024
#   docker compose run --rm omnischolar works openlibrary "Monica Neagoy"
#   docker compose run --rm omnischolar work crossref 10.1039/d4sc04973j          # JSON
#   docker compose run --rm omnischolar search hal "responsabilité civile" --domain shs.droit --from 2024
#   docker compose run --rm omnischolar merge openlibrary:"Monica Neagoy" crossref:"Monica Neagoy"
#   docker compose run --rm omnischolar merge openalex:A5108007452 hal:"Keitaro Nakatani" --from 2024 --format bibtex
#   docker compose run --rm omnischolar bare                   # plain PHP: no bundle, no container, and what PHP loaded
#   docker compose run --rm omnischolar test                   # every package's tests
#
# Sources come from GitHub (branch 1.x) unless their checkout sits under
# OMNISCHOLAR_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs.
name: omnischolar-harness

services:
  omnischolar:
    build: .
    image: glitchr/omnischolar-harness
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnischolar/core
      - ${OMNISCHOLAR_PLUGINS:-./plugins}:/omnischolar/plugins:ro
      - harness:/harness

volumes:
  harness:
